apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/aniket-devop/gitops-kubernetes-config.git
    targetRevision: main
    path: helm/gitops-demo
    helm:
      valueFiles:
        - ../../environments/staging/values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo-staging

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
